name: plante_seguro
description: "Aplicativo demonstrativo local para registro de exposicoes a agrotoxicos."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  geolocator: ^14.0.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.2.1
  intl: ^0.20.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - "Icon/plante_seguro_pin.png"
